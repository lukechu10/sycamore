name: Compare example Wasm sizes

on:
  pull_request:

# Trunk and Cargo can execute code from the PR. Keep this workflow read-only.
permissions:
  contents: read

concurrency:
  group: example-wasm-sizes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build examples (${{ matrix.revision }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TRUNK_VERSION: '0.21.1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: base
            repository: ${{ github.repository }}
            ref: ${{ github.event.pull_request.base.sha }}
          - revision: head
            repository: ${{ github.event.pull_request.head.repo.full_name }}
            ref: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Set up Rust
        id: rust
        run: |
          rustup default nightly
          rustc_version=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)
          echo "version=$rustc_version" >> "$GITHUB_OUTPUT"

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile

      # Reuse only exact baselines, never one from a different revision or toolchain.
      # Bump v1 if the build flags or the measurement format change.
      - name: Cache base report
        if: matrix.revision == 'base'
        id: base-report
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/example-wasm-sizes-base.json
          key: example-wasm-report-v1-${{ runner.os }}-${{ runner.arch }}-trunk${{ env.TRUNK_VERSION }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ matrix.ref }}

      - name: Set up Wasm target
        if: steps.base-report.outputs.cache-hit != 'true'
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Cargo dependencies and Trunk tools
        if: steps.base-report.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: example-wasm-${{ matrix.revision }}-trunk${{ env.TRUNK_VERSION }}
          cache-bin: false
          cache-directories: ~/.cache/trunk

      - name: Install Trunk
        if: steps.base-report.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/trunk.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/thedodd/trunk/releases/download/v$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "3def10251032028a4e1e697317abf40079c81cd14670236eabe0879698096270  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/trunk-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/trunk-bin" trunk
          echo "$RUNNER_TEMP/trunk-bin" >> "$GITHUB_PATH"

      - name: Build examples
        if: steps.base-report.outputs.cache-hit != 'true'
        run: |
          output="$RUNNER_TEMP/example-dist"
          mkdir -p "$output"
          # Match the GitHub Pages example builds in build_examples.yml.
          for path in examples/*/; do
            [[ -d "$path" ]] || continue
            example=$(basename "$path")
            echo "Building: $example"
            (
              cd "$path"
              dist_dir="$output/$example"
              mkdir "$dist_dir"
              trunk build --release --dist "$dist_dir" --public-url "/$example"
            )
          done

      - name: Measure emitted Wasm
        if: steps.base-report.outputs.cache-hit != 'true'
        env:
          SIZE_REPORT: ${{ runner.temp }}/example-wasm-sizes-${{ matrix.revision }}.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          dist = Path(os.environ["RUNNER_TEMP"]) / "example-dist"
          sizes = {
              example.name: sum(f.stat().st_size for f in example.rglob("*.wasm") if f.is_file())
              for example in sorted(dist.iterdir()) if example.is_dir()
          }
          with open(os.environ["SIZE_REPORT"], "w") as report:
              json.dump(sizes, report)
          PY

      - name: Upload sizes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-wasm-sizes-${{ matrix.revision }}.json
          path: ${{ runner.temp }}/example-wasm-sizes-${{ matrix.revision }}.json
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7
